project_id = "xoishsddcejcgcbdwdxz"

# As funções validam o token do usuário no próprio código (getClaims), o que
# funciona tanto com as chaves novas (sb_publishable/sb_secret) quanto com as
# legadas. enviar-lembretes-diarios é chamada só pelo pg_cron, com CRON_SECRET.

[functions.chat-lucas]
verify_jwt = false

[functions.gerar-habitos]
verify_jwt = false

[functions.gerar-treino]
verify_jwt = false

[functions.excluir-dados]
verify_jwt = false

[functions.salvar-push-subscription]
verify_jwt = false

[functions.enviar-lembretes-diarios]
verify_jwt = false

[auth]
# Endereço público do app (links de redefinição de senha apontam para cá).
# Ao trocar de domínio, atualize aqui e rode `npx supabase config push`.
site_url = "https://saude-mais-mais.vercel.app"
additional_redirect_urls = ["https://saude-mais-mais.vercel.app/**", "http://localhost:8080/**"]
minimum_password_length = 8

[auth.email]
# Cadastro sem confirmação por e-mail: o SMTP padrão do Supabase envia poucos
# e-mails por hora. Para ligar, configure um SMTP próprio antes.
enable_confirmations = false
# Valores atuais do projeto, fixados para o `config push` não trocá-los pelos padrões da CLI.
max_frequency = "1m0s"
otp_length = 8

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true
